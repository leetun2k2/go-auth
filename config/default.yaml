logger:
  production: true

server:
  name: "go-auth"
  production: true
  adminAddr: ":4040"
  shutdownTimeout: 15s

restful_api:
  production: true
  addr: ":5050"
  corsAllowOrigins: []

# PostgreSQL connection configuration (required runtime dependency).
# Environment overrides: POSTGRES__URL (required), POSTGRES__MAX_CONNS, POSTGRES__MIN_CONNS,
# POSTGRES__MAX_CONN_LIFETIME, POSTGRES__MAX_CONN_IDLE_TIME, POSTGRES__HEALTH_CHECK_PERIOD,
# POSTGRES__CONNECT_TIMEOUT.
postgres:
  url: ""

# Redis configuration (optional runtime dependency, disabled by default).
# Environment overrides: REDIS__ENABLED, REDIS__CONFIG__ADDR,
# REDIS__CONFIG__PASSWORD, REDIS__CONFIG__USERNAME, REDIS__CONFIG__DB.
redis:
  enabled: false
  config:
    addr: "127.0.0.1:6379"
    password: ""

# Shared Auth runtime configuration.
# Per-registration OAuth provider credentials (Google/GitHub) live in the
# clients table, not here -- each row is one provider OAuth app
# registration, identified by its own provider-issued client_id.
# Environment overrides: AUTH__ISSUER, AUTH__SESSION_TTL, AUTH__CODE_TTL,
# AUTH__LOGIN_ATTEMPT_TTL, AUTH__PROVIDER_SECRET_KEY,
# AUTH__SIGNING_KEY__KEY_ID, AUTH__SIGNING_KEY__PRIVATE_KEY_PEM (or AUTH__SIGNING_KEY__PRIVATE_KEY_PATH).
# The provider secret key and the signing key have no defaults: they must
# come from environment variables or an approved secret store, never from
# this file.
auth:
  issuer: ""
  session_ttl: 720h
  code_ttl: 2m
  login_attempt_ttl: 10m
  provider_secret_key: ""
  signing_key:
    key_id: ""
    private_key_pem: ""
    private_key_path: ""
